<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (P2.1).
      - script-src includes 'wasm-unsafe-eval' because pmtiles + maplibre-gl
        instantiate WebAssembly modules at runtime (vector-tile decoder).
      - worker-src allows blob: because pmtiles spawns its tile worker
        from a blob URL.
      - style-src needs 'unsafe-inline' because maplibre-gl injects its
        stylesheet via a <style> tag at runtime.
      - img-src + connect-src allow the map providers and PCR observations.
        connect-src data: also lets MapLibre reuse verified radar PNG bytes
        after a basemap replacement without downloading a second copy.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://api.mapbox.com https://*.tiles.mapbox.com https://*.mapbox.com https://tile.openstreetmap.org; connect-src 'self' data: https://api.mapbox.com https://*.tiles.mapbox.com https://*.mapbox.com https://tile.openstreetmap.org https://demotiles.maplibre.org https://monitor.protezionecivile.fvg.it https://nodc.ogs.it https://www.dati.friuliveneziagiulia.it; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; font-src 'self' https://fonts.gstatic.com https://demotiles.maplibre.org;" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232F5D3A'/%3E%3Cpath d='M3 11l3-5 3 4 4-6' stroke='%23FDFAF0' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preload" href="/fonts/manrope-variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>FriulView · Territorio e dati regionali</title>
    <meta name="description" content="Una mappa del Friuli Venezia Giulia: frane, alluvioni, sensori, ambiente, città e attività, organizzati in layer tematici." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
