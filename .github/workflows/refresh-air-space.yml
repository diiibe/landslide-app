name: Aggiorna dati Aria e industria
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: air-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/regional-requirements.txt
      - run: python -m pip install -r scripts/regional-requirements.txt
      - name: Verifica i parser e la conservazione delle ultime copie valide
        run: python scripts/test_air_space.py
      - name: Aggiorna pubblicazioni ARPA, SME e registri regionali
        run: python -u scripts/build-air-space.py
      - name: Pubblica l'archivio dello Spazio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/spaces/air/data.json public/data/spaces/air/context.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna fonti dello Spazio Aria e industria'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
