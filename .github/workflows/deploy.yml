name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
  workflow_run:
    workflows: ["Aggiorna dati regionali"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # roads_fvg.geojson + trails_fvg.geojson are gitignored (35-38 MB
      # each, OSM-derived). Every other static asset lives in the repo.
      # We bake them at deploy time so first-time visitors see road and
      # trail overlays without anyone running `npm run build:roads`
      # locally. Cache by UTC day, script and lockfile: scheduled deployments
      # refresh these source geometries daily without querying on every deploy.
      - id: roads-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - id: roads-cache
        uses: actions/cache@v4
        with:
          path: |
            public/data/roads_fvg.geojson
            public/data/trails_fvg.geojson
          key: roads-v2-${{ steps.roads-day.outputs.day }}-${{ hashFiles('scripts/build-roads.mjs', 'package-lock.json') }}

      # Overpass is rate-limited and flaky; the script retries across 3
      # mirrors. If all 3 are down the deploy fails fast — preferable
      # to shipping a map with no roads.
      - if: steps.roads-cache.outputs.cache-hit != 'true'
        run: npm run build:roads

      - run: VITE_BASE=/landslide-app/ VITE_MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }} npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
