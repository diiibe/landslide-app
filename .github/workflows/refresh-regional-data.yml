name: Aggiorna dati regionali
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: regional-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FVG_DATA_REFRESH: '1'
      TIPPECANOE_MAX_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/regional-requirements.txt
      - run: python -m pip install -r scripts/regional-requirements.txt
      - name: Installa tippecanoe verificato
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          test "$(git -C /tmp/tippecanoe rev-parse HEAD)" = '68ab8dcc229f95b8b25877697d5e8d66783af503'
          make -C /tmp/tippecanoe -j2
          sudo make -C /tmp/tippecanoe install
      - name: Sincronizza cartografie e registri
        run: python scripts/build-regional-data.py --workers 3
      - name: Sincronizza tabelle e parametri ambientali
        run: python scripts/build-regional-tables.py
      - name: Sincronizza osservazioni e catalogo sensori
        run: |
          python scripts/build-regional-observations.py
          python scripts/build-regional-products.py
      - name: Sincronizza edifici, suolo e dati di riserva
        run: python scripts/build-regional-supplement.py
      - name: Sincronizza immagini cartografiche
        run: python scripts/build-regional-raster.py
      - name: Verifica e assembla il catalogo
        run: |
          python scripts/assemble-regional-catalog.py
          python scripts/validate-regional-data.py
          python scripts/test_regional_pipeline.py
      - name: Pubblica i dati aggiornati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/regional public/data/twin
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna dati regionali e provenienza delle fonti'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
